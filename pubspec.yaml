name: ssh_ai_terminal
description: "移动端 SSH + AI 开发工具"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  # SSH
  dartssh2: 2.13.0
  # 缁堢娓叉煋
  xterm: ^4.0.0
  # 鐘舵€佺鐞?  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  # 鏈湴瀛樺偍
  hive_flutter: ^1.1.0
  # 瀹夊叏瀛樺偍
  flutter_secure_storage: ^10.0.0
  # 缃戠粶鐩戞帶
  connectivity_plus: ^5.0.0
  # 璺敱
  go_router: ^14.0.0
  # 宸ュ叿
  uuid: ^4.0.0
  path_provider: ^2.1.0
  crypto: ^3.0.7
  file_picker: ^10.3.10
  pinenacl: ^0.6.0
  pointycastle: ^3.7.4
  # AI CLI v1.1
  flutter_markdown: ^0.7.7+1
  http: ^1.0.0
  markdown: ^7.3.0
  google_fonts: ^8.0.2
  flutter_slidable: ^4.0.3
  flutter_highlighter: ^0.1.1
  flutter_riverpod: ^2.6.1
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  riverpod_generator: ^2.3.0
  fake_async: ^1.3.0

flutter:
  generate: true
  uses-material-design: true
  
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

  shaders:
    - assets/shaders/aurora.frag
    - assets/shaders/crt.frag



